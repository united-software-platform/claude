services:
  claude:
    build:
      context: .
      dockerfile: docker/claude/Dockerfile
      args:
        PROJECT_DIR: ${PROJECT_DIR:-/app}
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    image: ${IMAGE:?не задан тег образа}
    # Тег локальный: pull из registry заведомо не найдёт его, а `build` пересобирал
    # бы образ на каждый `run`. Берётся готовый локальный образ, сборка — `docker compose build`
    pull_policy: never
    # Отдельный compose-профиль: `docker compose up` сервисов окружения агента не поднимает
    profiles: ["claude"]
    # Команда по умолчанию — сам агент; аргумент после имени сервиса её заменяет (bash, git, …)
    command: claude
    working_dir: ${PROJECT_DIR:-/app}
    env_file: .env
    environment:
      # Консолидирует весь конфиг (.claude.json, .credentials.json)
      # в смонтированный каталог аккаунта, иначе авторизация слетает
      CLAUDE_CONFIG_DIR: ${CLAUDE_CONFIG_DIR:-/home/claude/.claude}

    volumes:
      - .:${PROJECT_DIR:-/app}                                             # рабочее дерево проекта
      # Профиль обязателен: без него путь схлопнется в каталог всех аккаунтов
      - ${CLAUDE_ACCOUNTS_DIR:-.claude-accounts}/${CLAUDE_PROFILE:?не задан профиль аккаунта Claude}:${CLAUDE_CONFIG_DIR:-/home/claude/.claude}
      - ${PROJECT_DIR:-/app}/${CLAUDE_ACCOUNTS_DIR:-.claude-accounts}      # анонимный том прячет чужие профили внутри контейнера
      - ${SSH_DIR:-.ssh}:${CONTAINER_SSH_DIR:-/home/claude/.ssh}           # ключи для работы с репозиторием